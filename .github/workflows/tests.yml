name: Tests

# Runs the unit tests and the tool checks of the VLab4Mic app against the Tools release that the installer pins.
# The pin is read from app/bash_bat_scripts/post_install.sh (LC_TOOLS_PIN): there is no second copy of it here.
# Documented override: the workflow_dispatch input `tools_spec` (same meaning as LC_TOOLS_SPEC in post_install.sh:
# any pip requirement, e.g. a wheel or a git URL); it is logged, and empty means "use the pin".
# One job on ubuntu with Python 3.12 (the Python of the installed app); the 29 lc_tests cases take about 5 minutes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tools_spec:
        description: "Optional pip requirement for labconstrictor-tools instead of the pin in post_install.sh (LC_TOOLS_SPEC)"
        required: false
        default: ""

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # never cancel a run on main

permissions:
  contents: read

jobs:
  tests:
    name: pytest and lc_tests (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      LC_HOME: ${{ github.workspace }}/.lc_home
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Read the Tools pin of the installer
        id: pin
        env:
          TOOLS_SPEC_INPUT: ${{ github.event.inputs.tools_spec }}
        run: |
          sh_pin="$(sed -n 's/^ *LC_TOOLS_PIN="\([^"]*\)".*/\1/p' app/bash_bat_scripts/post_install.sh)"
          bat_pin="$(tr -d '\r' < app/bash_bat_scripts/post_install.bat | sed -n 's/^ *[Ss][Ee][Tt] "LC_TOOLS_PIN=\([^"]*\)".*/\1/p')"
          echo "post_install.sh pin: '$sh_pin'; post_install.bat pin: '$bat_pin'"
          if [ -z "$sh_pin" ] || [ "$sh_pin" != "$bat_pin" ]; then
            echo "::error::LC_TOOLS_PIN is missing or differs between post_install.sh and post_install.bat"
            exit 1
          fi
          if [ -n "$TOOLS_SPEC_INPUT" ]; then
            spec="$TOOLS_SPEC_INPUT"
            echo "::warning::tools_spec override in use: $spec (not the installer pin $sh_pin)"
          else
            spec="https://github.com/CellMigrationLab/LabConstrictor-Tools/archive/refs/tags/${sh_pin}.zip"
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - name: Install VLab4Mic and the Tools
        env:
          TOOLS_SPEC: ${{ steps.pin.outputs.spec }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements.txt "$TOOLS_SPEC"
          python -m pip list | grep -i -E "labconstrictor|vlab4mic|pytest"

      - name: Run the unit tests
        run: python -m pytest tests -v -rs

      - name: Check the tool declarations
        if: ${{ !cancelled() }}  # also when pytest failed, so one run shows everything
        run: labconstrictor-tools check --module vlab4mic_lc_tools --pythonpath src

      - name: Run the tool test cases (lc_tests)
        if: ${{ !cancelled() }}
        run: |
          python lc_tests/make_fixtures.py lc_tests/fixtures
          labconstrictor-tools test --module vlab4mic_lc_tools --pythonpath src --cases lc_tests/cases.json
